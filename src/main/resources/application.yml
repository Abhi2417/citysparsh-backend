server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}   # Gmail App Password, not your login password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update   # change to create only the first time
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent_output: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  mail:
    from: ${MAIL_USERNAME}
    app-name: CitySparsh

# JWT Config
jwt:
  secret: ${JWT_SECRET:RADHAKRISHNA_VRINDAVAN_LOVE_WORLD_1342134213421342}
  expiration: ${JWT_EXPIRATION:86400000}   # 1 day in milliseconds
