server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}   # Gmail App Password, not your login password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # change to create only the first time
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent_output: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  mail:
    from: ${MAIL_FROM}
    app-name: CitySparsh
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  upload:
    dir: ${UPLOAD_DIR:uploads/complaints}

# JWT Config
jwt:
  secret: ${JWT_SECRET:RADHAKRISHNA_VRINDAVAN_LOVE_WORLD_1342134213421342}
  expiration: ${JWT_EXPIRATION:86400000}   # 1 day in milliseconds

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key:    ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
